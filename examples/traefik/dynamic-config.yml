---
http:
  services:
    auth-server:
      loadBalancer:
        servers:
          - url: http://auth-server:8081/

  middlewares:
    test-auth:
      forwardAuth:
        address: http://auth-server:8081/auth
        # Remove authResponseHeaders - auth-server doesn't set these headers
        # authResponseHeaders are only useful if your auth service sets them
        trustForwardHeader: true
        # Optional: Add authRequestHeaders to forward specific headers
        # authRequestHeaders:
        #   - "X-Forwarded-Method"
        #   - "X-Forwarded-Uri"

  routers:
    # Router for token endpoint (no auth required)
    token-router:
      rule: "PathPrefix(`/token`)"
      service: auth-server
      entrypoints:
        - http
      priority: 10

    # Router for auth endpoint (no auth required - it is the auth endpoint)
    auth-router:
      rule: "PathPrefix(`/auth`)"
      service: auth-server
      entrypoints:
        - http
      priority: 10

    # Protected route - forwards to auth-server health endpoint as demo
    health-router:
      rule: "PathPrefix(`/health`)"
      middlewares:
        - test-auth
      service: auth-server
      entrypoints:
        - http
      priority: 5
