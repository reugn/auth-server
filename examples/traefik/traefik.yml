---
global:
  checkNewVersion: true
  sendAnonymousUsage: false  # Consider privacy

entryPoints:
  websecure:
    address: ":443"
  http:
    address: ":8082"

api:
  dashboard: true
  insecure: true  # Consider adding authentication in production
  # Optional: Add authentication
  # dashboard: true
  # insecure: false
  # users:
  #   admin: "$2y$10$..." # bcrypt hash

providers:
  file:
    filename: /etc/traefik/dynamic-config.yml
    watch: true
  docker:
    network: proxy
    exposedByDefault: false  # Only expose containers with traefik.enable=true

# Optional: Add logging
# log:
#   level: INFO
#   format: json

# Optional: Add metrics
# metrics:
#   prometheus: {}
