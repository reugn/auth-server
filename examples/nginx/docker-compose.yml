networks:
  proxy:

services:
  nginx:
    restart: always
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-server
    networks:
      - proxy

  auth-server:
    restart: always
    container_name: auth-server
    image: auth-server:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      # Mount config files (use example-specific service config)
      - ./service_config.yml:/app/service_config.yml:ro
      - ../../config/local_repository_config.yml:/app/local_repository_config.yml:ro
      - ../../secrets:/app/secrets:ro
    environment:
      - AUTH_SERVER_LOCAL_CONFIG_PATH=/app/local_repository_config.yml
    networks:
      - proxy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
