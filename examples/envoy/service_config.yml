---
# Envoy-specific service configuration
signing-method: RS256

# Envoy proxy provider
proxy: envoy

# Repository provider
repository: local

# HTTP server configuration
http:
  host: 0.0.0.0
  port: 8081
  rate:
    tps: 1024
    size: 1024
    white-list: [ ]

# Secret configuration (paths are relative to /app in container)
secret:
  private-path: secrets/privkey.pem
  public-path: secrets/cert.pem

# Logger configuration
logger:
  level: DEBUG
  format: PLAIN
