version: "2"
run:
  timeout: 2m
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - errorlint
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - unparam
        path: _test\.go
      - linters:
          - revive
        path: internal/http/
        text: "var-naming.*package names"
      - linters:
          - revive
        path: internal/util/hash/
        text: "var-naming.*package names"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
